# Builds the Windows release on GitHub's windows runner — macOS cannot
# cross-compile Flutter Windows bundles, so this is THE Windows build path.
# Trigger manually (workflow_dispatch) or by pushing a v* tag.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # GEMINI_API_KEY comes from the repo's Actions secrets; the app builds
      # fine with an empty key (analysis degrades gracefully at runtime).
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          --dart-define=GEMINI_MODEL=gemini-2.5-flash

      - name: Zip bundle
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "build/windows/x64/runner/Release/*"
          -DestinationPath "ExtraAI-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ExtraAI-windows-x64
          path: ExtraAI-windows-x64.zip

      # On tag pushes, attach the zip to a GitHub Release for stable URLs.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          gh release create "${{ github.ref_name }}"
          "ExtraAI-windows-x64.zip"
          --title "Extra AI ${{ github.ref_name }}"
          --notes "Windows x64 build" ||
          gh release upload "${{ github.ref_name }}"
          "ExtraAI-windows-x64.zip" --clobber
